name: windows-release-candidate
on:
  workflow_dispatch:
  push: { tags: ['windows-collector-v*'] }
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  build-test-attest:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generate SPDX dependency SBOM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sbom = npm sbom --omit=dev --sbom-format spdx | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'npm sbom failed' }
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'cloudverse-windows-collector.spdx.json'),
            $sbom,
            [Text.UTF8Encoding]::new($false)
          )
          if ((Get-Item cloudverse-windows-collector.spdx.json).Length -lt 100) { throw 'SPDX SBOM is empty' }
      - run: npm prune --omit=dev
      - name: Assemble non-installable signing candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory release/cloudverse-windows-collector | Out-Null
          Copy-Item dist, package.json, package-lock.json, README.md, SECURITY.md, SOURCE_PROVENANCE.md, cloudverse-windows-collector.spdx.json -Destination release/cloudverse-windows-collector -Recurse
          New-Item -ItemType Directory release/cloudverse-windows-collector/node_modules | Out-Null
          Copy-Item node_modules/undici -Destination release/cloudverse-windows-collector/node_modules -Recurse
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          Copy-Item -LiteralPath $node -Destination release/cloudverse-windows-collector/node.exe
          $nodeLicense = Join-Path (Split-Path $node -Parent) 'LICENSE'
          if (Test-Path $nodeLicense -PathType Leaf) { Copy-Item -LiteralPath $nodeLicense -Destination release/cloudverse-windows-collector/NODE-LICENSE.txt }
          New-Item -ItemType Directory release/cloudverse-windows-collector/scripts/operations -Force | Out-Null
          Copy-Item scripts/operations/*.ps1 release/cloudverse-windows-collector/scripts/operations
          Copy-Item scripts/jea release/cloudverse-windows-collector/scripts/jea -Recurse
          Copy-Item scripts/Install-CloudVerseCollector.ps1, scripts/Install-CloudVerseJea.ps1, scripts/New-CloudVerseReleaseManifest.ps1 release/cloudverse-windows-collector/scripts
          @'
          This is an unsigned signing candidate, not an installable production release.
          An enterprise-approved pipeline must Authenticode-sign the installer and every
          operational script and every packaged JEA .ps1/.psm1/.psd1/.psrc asset
          with the same certificate, generate release-manifest.json, then assemble and attest
          the final archive. Source checkout signatures are intentionally absent.
          '@ | Set-Content release/cloudverse-windows-collector/UNSIGNED-CANDIDATE.txt
          Compress-Archive release/cloudverse-windows-collector/* cloudverse-windows-collector-unsigned.zip
          $digest = (Get-FileHash cloudverse-windows-collector-unsigned.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'cloudverse-windows-collector-unsigned.zip.sha256'),
            "$digest  cloudverse-windows-collector-unsigned.zip`n",
            [Text.UTF8Encoding]::new($false)
          )
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with: { subject-path: cloudverse-windows-collector-unsigned.zip }
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with: { subject-path: cloudverse-windows-collector-unsigned.zip, sbom-path: cloudverse-windows-collector.spdx.json }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: cloudverse-windows-collector-unsigned, path: 'cloudverse-windows-collector-unsigned.zip*', if-no-files-found: error }
      - name: Publish tagged candidate
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$env:GITHUB_REF_NAME" cloudverse-windows-collector-unsigned.zip cloudverse-windows-collector-unsigned.zip.sha256 --verify-tag --title "$env:GITHUB_REF_NAME (unsigned signing candidate)" --notes "Not installable. Requires enterprise Authenticode signing and final release attestation."
